            <h1>Game Development Diary: Building Indie RPGs From Scratch</h1>
            
            <p><em>Developer: <a href="https://www.youtube.com/channel/UC5EY2rDVHdIOskfZcwR8t3Q">Jason Coleman</a></em></p>
            
            <h2>Day 1: Concept & Scope Definition</h2>
            <p>
                Define core gameplay loop before writing code. What makes players feel powerful? What conflicts drive progression? For "The Last Stand", the hook was survival against impossible odds.
            </p>
            
            <h2>Technical Architecture Choices</h2>
            <p>
                Choose engine based on team size and goals. Unreal Engine provides high-end visuals but steep learning curve. Unity offers flexibility and cross-platform deployment. Godot is open source and lightweight.
            </p>
            
            <h2>Asset Pipeline Setup</h2>
            <p>
                Establish source control early (Git with Git LFS for large assets). Create folder structure: Art, Audio, Prefabs, Scripts, Scenes. Document naming conventions for team consistency.
            </p>
            
            <h2>Core Systems Development</h2>
            <p>
                <strong>Combat System:</strong> Hit detection, damage calculation, status effects
            </p>
            <p>
                <strong>Progression:</strong> Experience points, skill trees, equipment upgrades
            </p>
            <p>
                <strong>UI/UX:</strong> Health bars, inventory management, quest tracking
            </p>
            
            <h2>Playtesting Process</h2>
            <p>
                Weekly tests with fresh players. Observe without coaching. Note where they get confused or bored. Iterate on core loop before adding polish. Difficulty should ramp gradually.
            </p>
            
            <h2>Community Building</h2>
            <p>
                Share development progress on YouTube and Twitter. Create Discord for early access testers. Send builds to streamers for feedback. Listen to criticism without taking it personally.
            </p>
            
            <h2>Release Preparation</h2>
            <p>
                Build multiple platform versions (Windows, Mac, Linux). Create marketing assets: screenshots, trailers, store descriptions. Set up Steam page with wishlist option. Plan launch week activities.
            </p>
