            <h2>Midway 1942: Turning Point of the Pacific</h2>
            <p>
                The Battle of Midway showcased the vulnerability of Japanese carriers. USS Yorktown and Akagi sunk within hours, changing naval warfare forever. Codebreaking intelligence provided decisive advantage.
            </p>
            
            <h2>Coral Sea 1942: First Carrier vs Carrier Battle</h2>
            <p>
                Ships engaging without visual contact through aircraft. Lexington and Shoho lost. The battle prevented Japanese invasion of Port Moresby, preserving Australia's strategic position.
            </p>
            
            <h2>Leyte Gulf 1944: Largest Naval Battle in History</h2>
            <p>
                Japanese decoy force under Ozawa sacrificed carriers to draw US forces. Centered on the loss of Zuikaku and Zuihou. The battle crippled Japanesenavaltcapability permanently.
            </p>

            </p>

            <p>
