<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | JasonTV Marketplace</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body {
      background: #07090e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }
    h1 { font-size: 3rem; margin: 0 0 1rem; color: #ff0000; }
    p { font-size: 1.15rem; color: #94a3b8; max-width: 500px; margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      background: #ff0000;
      color: #fff;
      font-weight: 700;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn:hover { background: #cc0000; }
  </style>

  <meta property="og:image" content="https://jasontvmarketplace.com/assets/hero-banner.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://jasontvmarketplace.com/assets/hero-banner.jpg">

  <link rel="canonical" href="https://jasontvmarketplace.com/404.html">
</head>
<body>
  <div style="max-width:600px;text-align:center;padding:40px 20px;">
    <h1 style="font-size:2.5rem;color:#d5fa42;margin-bottom:10px;">Looking for a Product?</h1>
    <p style="font-size:1.1rem;color:#cbd5e1;line-height:1.6;" id="msg">The requested listing has been updated in our multi-channel catalog. Redirecting to our live store...</p>
    <div style="margin-top:25px;">
      <a href="/" class="btn" style="background:#d5fa42;color:#111;padding:12px 24px;border-radius:6px;text-decoration:none;font-weight:bold;">Explore Live Marketplace &rarr;</a>
    </div>
  </div>
  <script>
    (function() {
      const pth = window.location.pathname;
      if (!pth.includes('/products/')) return;
      const slug = pth.replace(/^.*\/products\//, '').replace(/\/$/, '').trim();
      const msg = document.getElementById('msg');
      if (slug) {
        // Guard against redirect loops: If the URL is already in canonical format (/products/spreadshop-*), do not re-redirect
        if (slug.startsWith('spreadshop-')) {
          msg.innerHTML = 'This product listing is currently unavailable. Redirecting to our live catalog search...';
          const cleanQuery = slug.replace(/^spreadshop-/, '').replace(/[^a-zA-Z0-9]+/g, ' ').trim();
          setTimeout(function() {
            window.location.replace('/?q=' + encodeURIComponent(cleanQuery));
          }, 1000);
          return;
        }

        // 1-to-1 direct mapping for legacy non-canonical Spreadshop URLs:
        // Legacy URLs were formatted as: <design-slug>-<product-type>-<id> (e.g. atomic-orbit-neon-14-oz--rkjv3907r3cp-773)
        const spreadshopMatch = slug.match(/(?:--|-)([a-z0-9]+-\d+)$/i);
        if (spreadshopMatch && spreadshopMatch[1]) {
          const target = '/products/spreadshop-' + spreadshopMatch[1] + '/';
          if (target !== window.location.pathname) {
            msg.innerHTML = 'Legacy listing detected. Forwarding to active product page <strong>' + spreadshopMatch[1] + '</strong>...';
            window.location.replace(target);
            return;
          }
        }

        // Numeric partner mapping (Printify, Zazzle, Redbubble, TeePublic)
        const numMatch = slug.match(/(\d{6,})$/);
        if (numMatch) {
          msg.innerHTML = 'Locating product <strong>' + numMatch[1] + '</strong>...';
          const cleanQuery = slug.replace(/^(ibx-|sprd_|ucm-|printify-|zazzle-|flow-gen-\d+-)/, '').replace(/[^a-zA-Z0-9]+/g, ' ').trim();
          window.location.replace('/?q=' + encodeURIComponent(cleanQuery));
          return;
        }

        // Fallback for deprecated synthetic mockups: search catalog for design
        msg.innerHTML = 'Searching catalog for <strong>' + slug + '</strong>...';
        const cleanQuery = slug.replace(/^(ibx-|sprd_|ucm-|printify-|zazzle-|flow-gen-\d+-)/, '').replace(/[^a-zA-Z0-9]+/g, ' ').trim();
        setTimeout(function() {
          window.location.replace('/?q=' + encodeURIComponent(cleanQuery));
        }, 1200);
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</body>
</html>
