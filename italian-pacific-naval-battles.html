            <h2>Midway 1942: Il Punto di Svolta</h2>
            <p>
                La battaglia di Midway ha mostrato la vulnerabilità dei portaerei giapponesi. Yorktown e Akagi abbandonati entro poche ore. La cryptanalisi ha fornito vantaggio decisionale.
            </p>
            
            <h2>Coral Sea 1942: Prima Battaglia Portaerei</h2>
            <p>
                Navi che si affrontano senza contatto visivo tramite aerei. Lexington e Shoho persi. La battaglia ha prevenuto l'invasione giapponese di Port Moresby.
            </p>
          p>
            <h2>Leyte Gulf 1944: La Più Grande Battaglia Navale</h2>
            <p>
                La forza di finta sotto Ozawa ha sacrificato portaerei per attirare le forze US. La battaglia ha colpito permanentemente la capacità navale giapponese.
            </p>
            
            <h2>Operazioni di Volo su Portaerei</h2>

            <p>
