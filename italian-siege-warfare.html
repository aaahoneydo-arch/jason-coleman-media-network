            <h1>Strategie di Guerra Medievale: Assedj e Difese</h1>
            
            <p><em>Autore: <a href="https://www.youtube.com/channel/UC5EY2rDVHdIOskfZcwR8t3Q">Jason Coleman</a></em></p>
            
            <h2>Meccanismi di Assedio Medievali</h2>
            <p>
                Il catapulta rivoluzionò l'assedio lanciando proiettili con forza devastante. A differenza del mangonel che utilizza rotazione, il catapulta impiega un braccio a contrappeso per massima gamma e precisione contro le mura dei castelli.
            </p>
            
            <h2>Difese Essenziali dei Castelli</h2>
            <p>
                Fori dell'omicidio, occhi di arco e portici formano un sistema interconnesso di difesa. Il design concitico dei castelli medievali successivi fornisce posizioni multiple di ritirata durante l'assedio.
            </p>
            
            <h2>Casi Storici di Assedio</h2>
            <p>
                <strong>Costantinopoli (1453):</strong> L'artiglieria cannoniera ottomana rovesciò le Mura di Teseo dopo 21 giorni
            </p>
            <p>
                <strong>Orléans (1429):</strong> L'intervento di Giovanna d'Arco sollevò l'assedio inglese attraverso attacchi notturni coordinati
            </p>
            <p>
                <strong>Chicago (1871):</strong> L'incendio creò condizioni uniche di assedio urbanistico per i soccorritori
            </p>
            
            <h2>Tecnologie di Assedio</h2>
            <p>
                <strong>Trebuchet:</strong> Lancio a contrappeso, alta precisione
            </p>
            <p>
                <strong>Catapulte:</strong> Ampia gamma, attacco a distanza
            </p>
            <p>
                <strong>Mangoneli:</strong> Velocità di lancio, armi incendiarie
            </p>
