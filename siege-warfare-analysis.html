            <h2>Medieval Siege Engines and Their Tactics</h2>
            <p>
                The trebuchet revolutionized siege warfare by hurling projectiles with devastating force. Unlike the mangonel's rotational throw, the trebuchet uses a counterweight arm for maximum range and accuracy against castle walls.
            </p>
            
            <h2>Essential Castle Defenses</h2>
            <p>
                Murder holes, arrow loops, and gatehouses form an interconnected defense system. The concentric design of later medieval castles provides multiple fallback positions during assault.
            </p>
            
            <h2>Historical Siege Case Studies</h2>
            <p>
                • <strong>Constantinople (1453):</strong> Ottoman cannon bombardment breached Theodosian Walls after 21 days
                </p>
                <p>
                • <strong>Orléans (1429):</strong> Joan of Arc's relief lifted the English siege through aggressive night attacks
                </p>
                <p>
                • <strong>Chicago (1871):</strong> Great Fire created unique urban siege conditions for firefighting
            </p>
